name: Publish Strangers updates

'on':
  push:
    branches: [codex/strangers-wholesale-publisher]

permissions:
  contents: read
  checks: write

concurrency:
  group: strangers-wholesale-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'georgefarrowgreen1'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify publisher safeguards
        run: python3 -m unittest -v test_publish.py
      - name: Publish with saved access and squash after Tests
        env:
          PUBLISH_CHECK_TOKEN: ${{ github.token }}
          STRANGERS_DEPLOY_TOKEN: ${{ secrets.STRANGERS_DEPLOY_TOKEN }}
        run: python3 publish.py
