  <section class="account-access" id="account-access" aria-labelledby="account-access-title">
    <div>
      <h2 id="account-access-title" tabindex="-1">Your Strangers account</h2>
      <p id="account-access-copy">Save your details, check orders and shop again.</p>
      <p id="account-access-status" role="status">Loading your account…</p>
      <button class="button outline" type="button" id="account-retry" hidden>Try again</button>
    </div>
    <div class="account-auth" id="account-auth" hidden>
      <form id="account-auth-form" method="post" action="/consumer-auth/login" hidden>
        <fieldset id="account-auth-fields" disabled></fieldset>
        <button class="button" type="submit" id="account-auth-submit" disabled>Sign in</button>
        <p id="account-auth-status" role="status"></p>
      </form>
      <nav class="account-auth-links" id="account-auth-links" aria-label="Account access"></nav>
    </div>
  </section>
